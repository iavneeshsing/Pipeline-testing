pool: vistara-agent

trigger:
  branches:
    include:
    - '*'

stages:
- stage: scan
  displayName: Scan

  jobs:
  - job: tflint
    displayName: TFlint

    steps:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: 'tflint --recursive'
      continueOnError: true

  - job: tfsec
    displayName: TFsec

    steps:

    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: 'tfsec'
      continueOnError: true


- stage: Terraform_Init
  displayName: "Terraform Init"

  jobs:
  - job: Init
    displayName: "Terraform Init"

    steps:

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        backendServiceArm: 'Pipelinetest'
        backendAzureRmResourceGroupName: 'rg-virat'
        backendAzureRmStorageAccountName: 'storagevirat'
        backendAzureRmContainerName: 'container1'
        backendAzureRmKey: 'terraform.tfstate'


- stage: Terraform_Plan
  displayName: "Terraform Plan"

  dependsOn: Terraform_Init
  condition: succeeded()

  jobs:
  - job: Plan
    displayName: "Terraform Plan"

    steps:

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        backendServiceArm: 'Pipelinetest'
        backendAzureRmResourceGroupName: 'rg-virat'
        backendAzureRmStorageAccountName: 'storagevirat'
        backendAzureRmContainerName: 'container1'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceNameAzureRM: 'Pipelinetest'



- stage: Terraform_Apply
  displayName: "Terraform Apply"

  dependsOn: Terraform_Plan
  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
    )

  jobs:
  - job: Apply
    displayName: "Terraform Apply"

    steps:

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        backendServiceArm: 'Pipelinetest'
        backendAzureRmResourceGroupName: 'rg-virat'
        backendAzureRmStorageAccountName: 'storagevirat'
        backendAzureRmContainerName: 'container1'
        backendAzureRmKey: 'terraform.tfstate'

    - task: TerraformTask@5
      displayName: "Terraform Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)'
        environmentServiceNameAzureRM: 'Pipelinetest'
        commandOptions: '-auto-approve'